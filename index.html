<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Freecash</title>
  <link rel="icon" href="data:," />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #030704;
      --green: #39ff88;
      --text: #f5fff7;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(57,255,136,0.15), transparent 50%);
      overflow-x: hidden;
    }

    body.lock {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .device-gate {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #000000; /* Complet negru conform cerintei */
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .device-gate.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .device-gate h2 {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 32px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .device-actions {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 320px;
      flex-direction: column;
    }

    .device-actions button {
      border: 2px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #ffffff;
      min-height: 64px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .device-actions button:hover,
    .device-actions button:active {
      background: rgba(57,255,136,0.1);
      border-color: var(--green);
      color: var(--green);
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 16px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .main-logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 18px;
      font-weight: 800;
      color: var(--green);
      margin-bottom: 32px;
    }

    .hero h1 {
      font-size: clamp(32px, 10vw, 42px);
      line-height: 1.1;
      letter-spacing: -0.04em;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .hero p {
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      line-height: 1.5;
      max-width: 320px;
      margin: 0 auto;
    }

    .sticky {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(430px, calc(100% - 32px));
      z-index: 20;
    }

    .cta {
      min-height: 64px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #031108;
      background: linear-gradient(180deg, #67ffa3, #20d66b);
      box-shadow: 0 12px 30px rgba(32,214,107,0.3);
      font-weight: 900;
      font-size: 18px;
      letter-spacing: -0.02em;
      text-align: center;
      padding: 0 16px;
      transition: transform 0.2s ease;
    }
    
    .cta:active {
      transform: scale(0.97);
    }

    .cta span {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cta small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      opacity: 0.8;
      margin-top: 2px;
      letter-spacing: 0;
    }
  </style>
</head>

<body class="lock">

  <!-- Ecranul initial de interogare a device-ului -->
  <div class="device-gate" id="deviceGate">
    <h2>Quel appareil utilises-tu ? 📱</h2>
    <div class="device-actions">
      <button id="btnIos">iOS 🍏</button>
      <button id="btnAndroid">Android 🤖</button>
    </div>
  </div>

  <!-- Continutul principal ultra-simplificat -->
  <main class="page">
    <img src="assets/freecash-logo.webp" alt="Freecash" class="main-logo">
    
    <div class="brand-pill">
      Freecash 🚀
    </div>
    
    <section class="hero">
      <h1>Gagne tes récompenses facilement ! 🎁</h1>
      <p>Rejoins-nous et commence à accumuler des récompenses dès aujourd'hui. C'est super simple et rapide ! ✨</p>
    </section>
  </main>

  <!-- Butonul verde sticky de la baza ecranului -->
  <div class="sticky">
    <a
      class="cta"
      href="https://taprkr.com/r/eyJ0IjoiZnJlZWNhc2gtY3BpIiwidGlkIjoiNzdjOGZlYjc5ODc4NDBjNTJlZDYiLCJ0cyI6MTc4OTcxMzE2Mzc2OH0"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>
        Commence maintenant & obtiens ta récompense →
        <small>Récupère ton bonus de départ</small>
      </span>
    </a>
  </div>

  <script>
    const deviceGate = document.getElementById("deviceGate");
    const btnIos = document.getElementById("btnIos");
    const btnAndroid = document.getElementById("btnAndroid");

    // Functie pentru deblocarea site-ului
    function unlockSite() {
      deviceGate.classList.add("hide");
      document.body.classList.remove("lock");
    }

    // Evenimente pentru butoanele de device
    btnIos.addEventListener("click", unlockSite);
    btnAndroid.addEventListener("click", unlockSite);

    // Daca vrei ca parametrii din URL sa se transmita mai departe catre linkul tau (pastrat din codul original)
    document.addEventListener("DOMContentLoaded", function () {
      const query = window.location.search;
      if (!query) return;

      document.querySelectorAll("a[href^='http']").forEach(function (link) {
        const href = link.getAttribute("href");
        if (href.includes("?")) {
          link.setAttribute("href", href + query.replace("?", "&"));
        } else {
          link.setAttribute("href", href + query);
        }
      });
    });
  </script>

</body>
</html>
